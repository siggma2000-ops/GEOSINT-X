
name: Build GEOSINT X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f main.py
          test -f buildozer.spec

      - name: Show Android configuration
        run: |
          grep -E '^(android.api|android.minapi|android.ndk_api)' buildozer.spec

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v --stacktrace android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEOSINT-X-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEOSINT-X-Build-Log
          path: build.log
          if-no-files-found: warn
          
